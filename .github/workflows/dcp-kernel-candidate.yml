name: DCP Kernel Candidate Verification

on:
  push:
    branches:
      - ideas/6d-dispatch-projection-20260816
  pull_request:
    paths:
      - 'dcp_kernel/**'
      - 'contracts/**'
      - 'fixtures/**'
      - 'tests/**'
      - 'tools/**'
      - 'pyproject.toml'
      - '.github/workflows/dcp-kernel-candidate.yml'

permissions:
  contents: read

jobs:
  candidate-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m compileall -q dcp_kernel tests tools
      - name: Parse machine contracts and fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for root in (Path('contracts'), Path('fixtures')):
              if not root.exists():
                  continue
              for path in root.rglob('*.json'):
                  json.loads(path.read_text(encoding='utf-8'))
                  print(path)
          PY
      - name: Run candidate tests
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Produce bounded legacy caller census
        run: python tools/census_legacy_references.py --output artifacts/reference-census.json
      - name: Validate withdrawal census evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('artifacts/reference-census.json').read_text(encoding='utf-8'))
          assert payload['runtime'] is False
          assert payload['promotion'] is False
          assert payload['destructive_action_authorized'] is False

          required = {
              'live_caller_count',
              'audit_reference_count',
              'unknown_hold_count',
              'rebuild_relevant_reference_count',
              'wake_routing_relevant_reference_count',
              'caller_absence_on_scanned_text_surface',
              'rebuild_withdrawal_candidate_on_scanned_text_surface',
              'wake_routing_withdrawal_candidate_on_scanned_text_surface',
              'reclaim_ready',
          }
          for family, summary in payload['summary'].items():
              missing = required - set(summary)
              assert not missing, (family, sorted(missing))
              assert summary['reclaim_ready'] is False
              print(family, summary)

          boundaries = set(payload['claim_boundary'])
          assert 'AUDIT_REFERENCE_IS_NOT_LIVE_CALLER' in boundaries
          assert 'CALLER_ABSENCE_ONLY_COVERS_SCANNED_TEXT_SURFACE' in boundaries
          assert 'REBUILD_OR_WAKE_KEYWORD_ABSENCE_DOES_NOT_PROVE_RUNTIME_DEPENDENCY_ABSENCE' in boundaries
          assert 'RECLAIM_READY_IS_NEVER_INFERRED_BY_THIS_CENSUS' in boundaries
          PY
      - name: Upload bounded census evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcp-reference-census
          path: artifacts/reference-census.json

# Passing this workflow proves only the declared bounded checks.
# It does not establish Native absorption, Platform Runtime, Promotion,
# autonomy, receiver-owned behavior change, non-text/runtime dependency absence,
# pooled reclaim authorization, or release approval.
