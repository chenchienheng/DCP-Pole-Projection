name: DCP Current Surface and Kernel Candidate Verification

on:
  push:
    branches:
      - main
      - ideas/6d-dispatch-projection-20260816
    paths:
      - 'README.md'
      - 'CURRENT-SURFACE-MANIFEST.json'
      - 'SEMANTIC-CONTROL-PLANE.json'
      - 'FAILURE-EVOLUTION-POLICY.md'
      - 'PUBLIC-SURFACE-POLICY.md'
      - 'STATUS.md'
      - 'dcp_kernel/**'
      - 'contracts/**'
      - 'fixtures/**'
      - 'tests/**'
      - 'tools/**'
      - 'pyproject.toml'
      - '.github/workflows/dcp-kernel-candidate.yml'

  pull_request:
    paths:
      - 'README.md'
      - 'CURRENT-SURFACE-MANIFEST.json'
      - 'SEMANTIC-CONTROL-PLANE.json'
      - 'FAILURE-EVOLUTION-POLICY.md'
      - 'PUBLIC-SURFACE-POLICY.md'
      - 'STATUS.md'
      - 'dcp_kernel/**'
      - 'contracts/**'
      - 'fixtures/**'
      - 'tests/**'
      - 'tools/**'
      - 'pyproject.toml'
      - '.github/workflows/dcp-kernel-candidate.yml'

permissions:
  contents: read

jobs:
  candidate-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        checkout_scope: ${{ fromJSON(github.event_name == 'pull_request' && '["candidate-head", "merge-candidate"]' || '["candidate-head"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.checkout_scope == 'candidate-head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify surface qualification regression cases
        run: python -m unittest discover -s tools -p 'test_current_surfaces.py' -v
      - name: Check current pointers and qualify candidate surface
        id: surface
        run: python tools/check_current_surfaces.py
      - name: Compile Python
        if: steps.surface.outputs.candidate == 'true'
        run: python -m compileall -q dcp_kernel tests tools
      - name: Parse machine contracts and fixtures
        if: steps.surface.outputs.candidate == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for root in (Path('contracts'), Path('fixtures')):
              if not root.exists():
                  continue
              for path in root.rglob('*.json'):
                  json.loads(path.read_text(encoding='utf-8'))
                  print(path)
          PY
      - name: Run candidate tests
        if: steps.surface.outputs.candidate == 'true'
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Produce bounded legacy caller census
        if: steps.surface.outputs.candidate == 'true'
        run: python -m tools.census_legacy_references --output artifacts/reference-census.json
      - name: Validate withdrawal census evidence
        if: steps.surface.outputs.candidate == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('artifacts/reference-census.json').read_text(encoding='utf-8'))
          assert payload['runtime'] is False
          assert payload['promotion'] is False
          assert payload['destructive_action_authorized'] is False

          required = {
              'live_caller_count',
              'audit_reference_count',
              'unknown_hold_count',
              'rebuild_relevant_reference_count',
              'wake_routing_relevant_reference_count',
              'caller_absence_on_scanned_text_surface',
              'rebuild_withdrawal_candidate_on_scanned_text_surface',
              'wake_routing_withdrawal_candidate_on_scanned_text_surface',
              'reclaim_ready',
          }
          for family, summary in payload['summary'].items():
              missing = required - set(summary)
              assert not missing, (family, sorted(missing))
              assert summary['reclaim_ready'] is False
              print(family, summary)

          boundaries = set(payload['claim_boundary'])
          assert 'AUDIT_REFERENCE_IS_NOT_LIVE_CALLER' in boundaries
          assert 'CALLER_ABSENCE_ONLY_COVERS_SCANNED_TEXT_SURFACE' in boundaries
          assert 'REBUILD_OR_WAKE_KEYWORD_ABSENCE_DOES_NOT_PROVE_RUNTIME_DEPENDENCY_ABSENCE' in boundaries
          assert 'RECLAIM_READY_IS_NEVER_INFERRED_BY_THIS_CENSUS' in boundaries
          PY
      - name: Upload bounded census evidence
        if: steps.surface.outputs.candidate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dcp-reference-census-${{ matrix.checkout_scope }}
          path: artifacts/reference-census.json

      - name: Package and reopen the verified candidate source
        if: steps.surface.outputs.candidate == 'true' && matrix.checkout_scope == 'candidate-head'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import subprocess
          import sys
          import tempfile
          import zipfile

          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          target = Path('artifacts/dcp-source-checkout.zip')
          subprocess.run(['git', 'archive', '--format=zip', f'--output={target}', revision], check=True)
          with tempfile.TemporaryDirectory(prefix='dcp-source-reopen-') as directory:
              restored = Path(directory)
              with zipfile.ZipFile(target) as archive:
                  for item in archive.infolist():
                      path = PurePosixPath(item.filename)
                      if path.is_absolute() or '..' in path.parts or '\\' in item.filename:
                          raise ValueError('UNSAFE_ARCHIVE_PATH')
                      if stat.S_ISLNK(item.external_attr >> 16):
                          raise ValueError('SOURCE_ARCHIVE_SYMLINK_REQUIRES_EXPLICIT_PACKAGING')
                  archive.extractall(restored)
              env = dict(os.environ)
              env.pop('PYTHONPATH', None)
              subprocess.run([sys.executable, '-m', 'tools.verify_artifact_delivery', '--help'],
                             cwd=restored, env=env, check=True)
              subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests',
                              '-p', 'test_artifact_delivery_resume.py', '-v'],
                             cwd=restored, env=env, check=True)
          raw = target.read_bytes()
          manifest = {'checkout': revision, 'path': target.name, 'size_bytes': len(raw),
                      'sha256': hashlib.sha256(raw).hexdigest(),
                      'scope': 'TRACKED_SOURCE_CHECKOUT_NOT_RELEASE_APPROVAL',
                      'reopened_normal_package': True, 'network_install_performed': False}
          Path('artifacts/source-checkout.json').write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print('SOURCE_CHECKOUT_RECEIPT=' + json.dumps(manifest, sort_keys=True))
          PY
      - name: Upload verified candidate source
        if: steps.surface.outputs.candidate == 'true' && matrix.checkout_scope == 'candidate-head'
        uses: actions/upload-artifact@v4
        with:
          name: dcp-source-checkout-candidate-head
          path: |
            artifacts/dcp-source-checkout.zip
            artifacts/source-checkout.json
          if-no-files-found: error

# Passing this workflow proves only the declared bounded checks.
# It does not establish Native absorption, Platform Runtime, Promotion,
# autonomy, receiver-owned behavior change, non-text/runtime dependency absence,
# pooled reclaim authorization, or release approval.
